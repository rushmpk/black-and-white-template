<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/f1b59e5051.js" crossorigin="anonymous"></script>
    <style>
        body{
            background-image: url('img/login2.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }
        .login-wrap{
            width: 25%;
            background: linear-gradient(to bottom,rgb(255, 255, 255),rgb(0, 0, 0));
            margin-left: 550px;
            margin-top: 120px;
            border-radius: 10px;
            font-family: cursive;
            padding: 30px;
            box-shadow: -8px 10px 40px ;
           
            
        }
        .form-wrap{
            text-align: center;
            padding: 40px;

        }
        .form-wrap h1{
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        input{
            padding: 8px;
            width: 180px;
            border-radius: 8px;
            border: none;
            
        }
        .btn-form{
            border: none;
            padding: 12px;
            width: 50%;
            border-radius: 8px;
            background: linear-gradient(to right,white,rgb(149, 146, 146));
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 15px;
        }
        .btn-form:hover{
            background: linear-gradient(to left,white,black);
        }
        .fa-user-lock{
            font-size: 30px;
        }

    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="form-wrap">
        <i class="fa-solid fa-user-lock"></i>
        <h1>login</h1>
        <i class="fa-solid fa-user"></i>
        <label for="username">username</label>&nbsp;
        <!-- <br>
        <br> -->
        <input type="text" name="" id="">
        <br>
        <br>
        <br>
        <i class="fa-solid fa-key"></i>
        <label for="password">password</label>&nbsp;
        <input type="password">
        <br>
        <br>
        <br>

        <button class="btn-form">Login</button>
        </div>

    </div>
</body>
</html>
